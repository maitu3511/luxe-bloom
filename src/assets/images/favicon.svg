<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7c83b" />
      <stop offset="50%" stop-color="#f5b800" />
      <stop offset="100%" stop-color="#c28c00" />
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a3a3a3" />
    </linearGradient>
  </defs>

  <!-- Elegant Outer Hexagon (Structural Packaging Dieline theme) -->
  <polygon points="32,2 59,17 59,47 32,62 5,47 5,17" stroke="url(#gold-grad)" stroke-width="3.5" fill="#000000" stroke-linejoin="round" />
  
  <!-- Outer concentric offset accent -->
  <polygon points="32,7 54,19 54,45 32,57 10,45 10,19" stroke="rgba(245, 184, 0, 0.3)" stroke-width="1.2" fill="none" stroke-linejoin="round" />

  <!-- Stylized Monogram S and C inside the crest -->
  <path d="M22,22 C22,22 32,16 40,22 C48,28 34,36 32,38 C30,40 20,44 26,52 C32,60 44,50 44,50" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M42,24 C42,24 48,28 46,36" stroke="url(#silver-grad)" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M20,34 C18,42 22,46 26,48" stroke="url(#silver-grad)" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
